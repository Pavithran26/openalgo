name: Sync upstream OpenAlgo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Pavithran26/openalgo'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/marketcalls/openalgo.git
          git fetch upstream main

      - name: Merge upstream without overwriting fork commits
        run: |
          git checkout main
          git merge --no-edit upstream/main

      - name: Push updated main to this fork
        run: git push origin HEAD:main
